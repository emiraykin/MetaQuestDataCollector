# A tapered plastic cup that nests into another (migrated from mujoco_toy-project). Geometry comes from cup.py;
# a task can change the shape, e.g.  mug: {asset: cups/cup, builder_args: {top_radius: 0.04}, rgba: [...]}
builder: cup.py:cup
builder_args: {bottom_radius: 0.028, top_radius: 0.036, height: 0.07, thickness: 0.003, n_wall: 16}
mass: 0.035                  # density 600 kg/m^3 over the toy's geoms
friction: 1.0
rgba: [0.9, 0.3, 0.2, 1]
