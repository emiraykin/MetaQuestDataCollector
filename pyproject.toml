[project]
name = "xrcollect"
version = "0.1.0"
description = "Task-agnostic VR data collection for simulated robot manipulation (Meta Quest 3 + MuJoCo)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "mink>=0.0.5",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "h5py>=3.10",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "pillow>=10.0",
    "daqp>=0.5",
    "fast-simplification>=0.2.0",
    "gymnasium>=1.0",       # xrcollect.gym_env: every task as a Gymnasium environment (RL)
]

[project.optional-dependencies]
# LeRobot dataset export (xrcollect/export/lerobot.py). Brings torch.
lerobot = ["lerobot"]
# `xrc import-mesh`: convex decomposition of arbitrary meshes.
mesh = ["coacd>=1.0", "trimesh>=4.0"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
xrc = "xrcollect.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xrcollect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.uv]
# lerobot -> pynput -> evdev needs a C compiler; only lerobot's keyboard teleop uses it, never dataset export.
override-dependencies = ["evdev; sys_platform == 'never'"]
